<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <h1>Capstone Progress Board</h1>
  <style>
    body {
      margin: 0;
      padding: 60px 24px;
      background: #f1f5f9;
      color: #172033;
      font-family: system-ui, sans-serif;
    }

    main {
      max-width: 640px;
      margin: auto;
      padding: 32px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 35px #17203312;
    }

    .eyebrow {
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    h1 { margin-bottom: 8px; }
    p { color: #64748b; }
    ul { padding: 0; list-style: none; }

    li {
      margin-top: 12px;
      padding: 18px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }
    label {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    }

    input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #2563eb;
    }

    label:has(input:checked) {
    color: #94a3b8;
    text-decoration: line-through;
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">CAPSTONE / TEAM WORKSPACE</span>
    <h1>Capstone Task Board</h1>
    <p>A shared checklist for our next project milestone.</p>

    <ul>
  <li>
    <label>
      <input type="checkbox">
      Review project requirements
    </label>
  </li>
  <li>
    <label>
      <input type="checkbox">
      Draft the system architecture
    </label>
  </li>
  <li>
    <label>
      <input type="checkbox">
      Prepare the sprint demonstration
    </label>
  </li>
</ul>
  </main>
</body>
</html>
